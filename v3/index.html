<!doctype html>
<html lang="zh-CN">
<head>

<title>Research Atlas V3 · UI Preview</title>
<link rel="stylesheet" href="style.css">

<body>
<aside class="rail">
  <a class="brand" href="#research"><span class="mark">RA</span><span><b>Research Atlas</b><small>Evidence before conviction</small></span></a>
  <div class="picker"><label for="company">Company / Ticker</label><select id="company"></select><p>公开静态预览 · 不写入研究数据库</p></div>
  <nav>
    <button data-page="research" aria-current="page"><span>01</span><b>Research</b><small>这家公司是什么？值得研究什么？</small></button>
    <button data-page="evidence"><span>02</span><b>Evidence</b><small>事实从哪里来？</small></button>
    <button data-page="analysis"><span>03</span><b>Analysis</b><small>发生了什么，为什么？</small></button>
    <button data-page="report"><span>04</span><b>Report</b><small>我现在怎么看？</small></button>

  <div class="rail-foot"><span>V3 UI PREVIEW</span><p>Surface simple · logic deep</p><a href="../">打开旧版公开演示 ↗</a></div>
</aside>
<div class="app">
<header class="topbar"><div><b id="ticker">—</b><span id="companyName">Research Atlas</span><small id="subtitle"></small></div><span>As of 2025-03-01</span></header>
<main><div class="notice">这是 V3 UI 静态预览，用现有历史 fixture 展示交互结构。SEC 自动抓取、PDF 解析与 AI 仍未接入。</div><div id="content"></div></main>
<footer><span>Research Atlas V3</span><span>公开披露 · 可复核计算 · 可检验判断</span></footer>
</div>
<dialog id="drawer"><div class="drawer-head"><div><small>EVIDENCE</small><h2 id="drawerTitle">来源</h2></div><button id="close">×</button></div><div id="drawerBody"></div></dialog>
<nav class="mobile"><button data-page="research">Research</button><button data-page="evidence">Evidence</button><button data-page="analysis">Analysis</button><button data-page="report">Report</button></nav>
</body></html>
